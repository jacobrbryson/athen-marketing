<div class="min-h-screen bg-gradient-to-b from-amber-50 to-white flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-3xl shadow-xl p-8 text-center">
    <div class="text-6xl mb-3">🦉</div>
    <h1 class="text-2xl font-bold text-gray-900 mb-1">Hi there!</h1>
    <p class="text-gray-600 mb-6">Type your secret code to start playing with Athena.</p>

    <input
      class="w-full text-center tracking-widest text-xl font-bold uppercase border-2 border-amber-300 rounded-xl px-4 py-3 mb-2 outline-none focus:ring-2 focus:ring-amber-400"
      type="text"
      placeholder="SUNNY-APPLE"
      autocomplete="off"
      autocapitalize="characters"
      spellcheck="false"
      [value]="code()"
      (input)="setCode($any($event.target).value)"
      (keyup.enter)="submit()"
    />

    @if (error()) {
    <p class="text-red-500 text-sm mb-2">{{ error() }}</p>
    }

    <button
      class="btn-primary w-full mt-3 text-lg py-3"
      (click)="submit()"
      [disabled]="busy() || !code()"
    >
      {{ busy() ? 'Let’s go…' : "Let's go! 🚀" }}
    </button>

    <a routerLink="/login" class="block text-xs text-gray-400 mt-6 hover:text-gray-600">
      I’m a grown-up — sign in here
    </a>
  </div>
</div>
