<div class="relative inline-block text-left">
  <button
    type="button"
    class="flex items-center gap-2 px-3 py-2 rounded-full border border-gray-200 bg-white hover:bg-gray-50 transition-colors shadow-sm"
    (click)="toggle()"
    [disabled]="switching()"
  >
    <span
      class="flex items-center justify-center w-7 h-7 rounded-full text-white text-sm font-bold"
      [class.bg-indigo-500]="activeProfile().kind === 'parent'"
      [class.bg-amber-500]="activeProfile().kind === 'child'"
    >
      {{ (activeProfile().label || '?').charAt(0) }}
    </span>
    <span class="text-sm font-medium text-gray-700 max-w-[8rem] truncate">{{ activeProfile().label }}</span>
    <span class="text-gray-400 text-xs">▾</span>
  </button>

  @if (open()) {
  <div
    class="absolute right-0 mt-2 w-60 origin-top-right rounded-xl bg-white shadow-lg ring-1 ring-black/5 z-20 py-2"
  >
    <p class="px-4 py-1 text-xs font-semibold text-gray-400 uppercase">Switch profile</p>

    <!-- Parent -->
    <button
      class="w-full flex items-center gap-3 px-4 py-2 hover:bg-gray-50 text-left"
      (click)="switchToParent()"
    >
      <span class="flex items-center justify-center w-8 h-8 rounded-full bg-indigo-500 text-white font-bold">
        {{ parentLabel.charAt(0) }}
      </span>
      <span class="flex-1">
        <span class="block text-sm font-medium text-gray-800">{{ parentLabel }}</span>
        <span class="block text-xs text-gray-400">Parent</span>
      </span>
      @if (activeProfile().kind === 'parent') {<span class="text-indigo-500">✓</span>}
    </button>

    <!-- Children -->
    @for (child of children(); track child.uuid) {
    <button
      class="w-full flex items-center gap-3 px-4 py-2 hover:bg-gray-50 text-left"
      (click)="switchToChild(child)"
    >
      <span class="flex items-center justify-center w-8 h-8 rounded-full bg-amber-500 text-white font-bold">
        {{ (child.display_name || '?').charAt(0) }}
      </span>
      <span class="flex-1">
        <span class="block text-sm font-medium text-gray-800">{{ child.display_name }}</span>
        <span class="block text-xs text-gray-400">Child{{ child.grade ? ' · ' + child.grade : '' }}</span>
      </span>
      @if (activeProfile().profileUuid === child.profile_uuid) {<span class="text-amber-500">✓</span>}
    </button>
    } @empty {
    <p class="px-4 py-2 text-xs text-gray-400">No children yet.</p>
    }
  </div>
  }
</div>
